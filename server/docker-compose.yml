services:
  postgres:
    image: postgres:16
    container_name: recovr_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recovr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: recovr_redis
    restart: unless-stopped
    ports:
        - '6379:6379'
    volumes:
        - redis_data:/data

volumes:
  postgres_data:
  redis_data:
